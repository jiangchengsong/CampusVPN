name: CampusVPN
options:
  bundleIdPrefix: com.campusvpn
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  CampusVPN:
    type: application
    platform: macOS
    sources:
      - path: CampusVPN
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: CampusVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: CampusVPN/CampusVPN.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.campusvpn.CampusVPN
        PRODUCT_NAME: CampusVPN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
